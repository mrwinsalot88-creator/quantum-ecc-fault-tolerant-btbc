name: BTBC bridge action location diagnostic

on:
  push:
    branches: [btbc-local-agent]
    paths:
      - 'scripts/diagnose_bridge_action_locations.py'
      - '.github/workflows/btbc-bridge-action-location.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: btbc-local-agent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip && pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3
      - name: Generate probe worlds
        run: >-
          python scripts/generate_worlds.py --num-worlds 24 --min-fields 8 --max-fields 20 --temporal-depth 7
          --corruption-rate 0.16 --high-trust-corruption-fraction 0.30 --relationship-density 0.25
          --duplicate-conflict-rate 0.20 --burstiness 0.35 --legitimate-change-rate 0.20
          --provenance-noise 0.35 --seed 3692046 --out-dir results/location/base --clean
      - name: Add genuine support
        run: >-
          python scripts/inject_true_corroboration.py --src results/location/base --out results/location/supported
          --seed 6469203 --support-rate 0.75 --min-witnesses 2 --max-witnesses 3
      - name: Add false consensus
        run: >-
          python scripts/inject_false_consensus.py --src results/location/supported --out results/location/mixed
          --seed 9632046 --attack-rate 0.40 --min-colluders 3 --max-colluders 4
      - name: Locate actions
        run: >-
          python scripts/diagnose_bridge_action_locations.py --scenarios results/location/mixed --limit 24
          --out results/location/action_locations.json
      - uses: actions/upload-artifact@v4
        with:
          name: btbc-bridge-action-location-results
          path: results/location/action_locations.json
