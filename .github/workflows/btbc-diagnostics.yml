name: BTBC frozen bridge diagnostics

on:
  push:
    branches: [btbc-local-agent]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: btbc-local-agent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install diagnostic dependencies
        run: python -m pip install --upgrade pip && pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3 pytest
      - name: Test diagnostics
        run: pytest tests/test_diagnose_worlds.py -q
      - name: Recreate first 20 worlds from the locked generated-world config
        run: >-
          python scripts/generate_worlds.py
          --num-worlds 20
          --min-fields 5
          --max-fields 20
          --temporal-depth 5
          --corruption-rate 0.10
          --high-trust-corruption-fraction 0.20
          --relationship-density 0.15
          --duplicate-conflict-rate 0.10
          --burstiness 0.20
          --legitimate-change-rate 0.10
          --provenance-noise 0.25
          --seed 369
          --out-dir results/diagnostic_worlds
          --clean
      - name: Run pre-gate and permissive diagnostics
        run: python scripts/diagnose_worlds.py --scenarios results/diagnostic_worlds --limit 20 --out-dir results/debug
      - name: Print diagnostic summary
        run: cat results/debug/diagnostic_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: btbc-frozen-bridge-diagnostics
          path: |
            results/diagnostic_worlds/manifest.json
            results/debug/
          if-no-files-found: error
