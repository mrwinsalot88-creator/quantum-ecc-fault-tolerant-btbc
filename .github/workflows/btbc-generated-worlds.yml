name: BTBC generated-world benchmark

on:
  push:
    branches: [btbc-local-agent]
    paths:
      - '.github/workflows/btbc-generated-worlds.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-worlds:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: btbc-local-agent

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install experiment dependencies
        run: >-
          python -m pip install --upgrade pip &&
          pip install
          numpy==2.3.5
          pandas==2.2.3
          scipy==1.17.0
          scikit-learn==1.8.0
          joblib==1.5.3
          pytest

      - name: Test generator
        run: pytest tests/test_generated_worlds.py -q

      - name: Generate 200 independent worlds
        run: >-
          python scripts/generate_worlds.py
          --num-worlds 200
          --min-fields 5
          --max-fields 20
          --temporal-depth 5
          --corruption-rate 0.10
          --high-trust-corruption-fraction 0.20
          --relationship-density 0.15
          --duplicate-conflict-rate 0.10
          --burstiness 0.20
          --legitimate-change-rate 0.10
          --provenance-noise 0.25
          --seed 369
          --out-dir results/generated_worlds
          --clean

      - name: Run baseline and ablations on the same worlds
        run: >-
          python scripts/run_experiments.py
          --scenarios-dir results/generated_worlds
          --out-dir results/generated_ab
          --conditions baseline,no_relations,no_temporal,no_provenance
          --workers 4

      - name: Print experiment summary
        run: cat results/generated_ab/experiment_summary.json

      - name: Upload generated-world results
        uses: actions/upload-artifact@v4
        with:
          name: btbc-generated-world-results
          path: |
            results/generated_worlds/manifest.json
            results/generated_ab/
          if-no-files-found: error
