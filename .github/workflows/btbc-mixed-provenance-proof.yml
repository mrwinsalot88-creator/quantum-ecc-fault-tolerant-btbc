name: BTBC mixed provenance proof

on:
  push:
    branches: [btbc-local-agent]
    paths:
      - 'scripts/test_mixed_provenance_attack_v4.py'
      - '.github/workflows/btbc-mixed-provenance-proof.yml'
  workflow_dispatch:

jobs:
  mixed-proof:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: btbc-local-agent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3 pytest
      - name: Generate mixed base worlds
        run: >-
          python scripts/generate_worlds.py
          --num-worlds 120 --min-fields 8 --max-fields 20 --temporal-depth 7
          --corruption-rate 0.16 --high-trust-corruption-fraction 0.30
          --relationship-density 0.25 --duplicate-conflict-rate 0.20
          --burstiness 0.35 --legitimate-change-rate 0.20
          --provenance-noise 0.35 --seed 3692026
          --out-dir results/mixed_proof/base --clean
      - name: Inject coordinated false consensus
        run: >-
          python scripts/inject_false_consensus.py
          --src results/mixed_proof/base --out results/mixed_proof/attacked
          --seed 9632026 --attack-rate 0.40 --min-colluders 3 --max-colluders 4
      - name: Run provenance-family-aware comparison
        run: >-
          python scripts/test_mixed_provenance_attack_v4.py
          --scenarios results/mixed_proof/attacked --limit 120
          --out results/mixed_proof/summary.json
      - name: Enforce proof criteria
        run: |
          python - <<'PY'
          import json, sys
          s=json.load(open('results/mixed_proof/summary.json'))['summary']
          arm=s['arms']['btbc_v2_history_anchor']
          criteria={
            'anchors_present': s['anchor_count'] > 0,
            'real_repairs_present': arm['true_repairs'] > 0,
            'zero_false_corrections': arm['false_corrections'] == 0,
            'zero_legitimate_change_damage': arm['legitimate_change_damage'] == 0,
            'net_error_reduction': arm['final_error_count'] < arm['pre_error_count'],
            'no_worlds_worsened': arm['worlds_worsened'] == 0,
          }
          print(json.dumps({'summary':s,'criteria':criteria},indent=2,sort_keys=True))
          if not all(criteria.values()): sys.exit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btbc-mixed-provenance-proof-results
          path: |
            results/mixed_proof/attacked/manifest.json
            results/mixed_proof/summary.json
