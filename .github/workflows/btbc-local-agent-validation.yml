name: BTBC local-agent validation

on:
  push:
    branches: [btbc-local-agent]
    paths-ignore:
      - 'btbc/frozen/router.joblib'
      - 'btbc/frozen/operating.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: btbc-local-agent

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install frozen validation dependencies
        run: >-
          python -m pip install --upgrade pip &&
          pip install
          numpy==2.3.5
          pandas==2.2.3
          scipy==1.17.0
          scikit-learn==1.8.0
          joblib==1.5.3
          pytest

      - name: Regenerate frozen v1.4 router
        run: python scripts/regenerate_router_v14.py

      - name: Verify router SHA256
        run: |
          python - <<'PY'
          import hashlib
          p='btbc/frozen/router.joblib'
          got=hashlib.sha256(open(p,'rb').read()).hexdigest()
          expected='b9b9b5968af0313a86c9d3c398a4a56c8895da8ddd711fa56137d7daea633adf'
          print('router.joblib sha256:', got)
          if got != expected:
              raise SystemExit(f'router hash mismatch: expected {expected}, got {got}')
          PY

      - name: Run strict adapter integration tests
        run: pytest tests/test_adapter_integration.py -q

      - name: Commit deterministic router artifact
        if: success()
        run: |
          if git diff --quiet -- btbc/frozen/router.joblib btbc/frozen/operating.json && git ls-files --error-unmatch btbc/frozen/router.joblib >/dev/null 2>&1; then
            echo 'Frozen router artifacts already committed and unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f btbc/frozen/router.joblib btbc/frozen/operating.json
          git commit -m 'Add deterministic frozen v1.4 router artifact'
          git push origin HEAD:btbc-local-agent
