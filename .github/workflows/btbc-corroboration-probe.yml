name: BTBC synthetic corroboration probe

on:
  push:
    branches: [btbc-local-agent]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: btbc-local-agent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 joblib==1.5.3 pytest
      - name: Test corroboration probe
        run: pytest tests/test_probe_corroboration.py -q
      - name: Recreate first 20 worlds
        run: >-
          python scripts/generate_worlds.py
          --num-worlds 20
          --min-fields 5
          --max-fields 20
          --temporal-depth 5
          --corruption-rate 0.10
          --high-trust-corruption-fraction 0.20
          --relationship-density 0.15
          --duplicate-conflict-rate 0.10
          --burstiness 0.20
          --legitimate-change-rate 0.10
          --provenance-noise 0.25
          --seed 369
          --out-dir results/probe_worlds
          --clean
      - name: Run synthetic corroboration causal probe
        run: python scripts/probe_corroboration.py --scenarios results/probe_worlds --limit 20 --anchors-per-target 8 --out results/debug/corroboration_probe.json
      - name: Print probe summary
        run: cat results/debug/corroboration_probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: btbc-corroboration-probe
          path: results/debug/corroboration_probe.json
          if-no-files-found: error
