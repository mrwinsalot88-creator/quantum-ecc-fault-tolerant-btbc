name: BTBC unknown-state quantum test

on:
  push:
    branches: [btbc-local-agent]
    paths:
      - 'scripts/test_btbc_unknown_state_qec.py'
      - '.github/workflows/btbc-unknown-state-qec.yml'
  workflow_dispatch:

jobs:
  unknown-state-qec:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy
      - name: Run frozen unknown-state X/Y/Z benchmark
        run: python scripts/test_btbc_unknown_state_qec.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btbc-unknown-state-qec-results
          path: artifacts/btbc_unknown_state_qec_results.json
